<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffe6f2;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #ffccd5;
            width: 100%;
            max-width: 400px; /* ป้องกันไม่ให้การ์ดใหญ่เกินไป */
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: #ff6699;
            border-color: #ff6699;
        }
        .btn-primary:hover {
            background-color: #ff3366;
            border-color: #ff3366;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center">
        <div class="card text-center p-3">
            <div class="card-header">
                🩷🩷🩷
            </div>
            <div class="card-body">
                <h5 class="card-title">This is Valentine's Day!</h5>
                <p class="card-text">Are you ready for your Valentine's Day gift?</p>
                <a href="vask.html" class="btn btn-primary">Ready. Let's start.</a>
                <p class="card-text mt-2">(You have no right to refuse. 😚)</p>
            </div>
        </div>
    </div>
</body>
</html>
