<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width: device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6f2;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #ffccd5;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .btn-primary {
            background-color: #ff6699;
            border-color: #ff6699;
        }
        .btn-primary:hover {
            background-color: #ff3366;
            border-color: #ff3366;
        }
    </style>
</head>
<body>
    <div class="card text-center">
        <h5 id="message"></h5>
        <button id="nextButton" class="btn btn-primary mt-3"></button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('name') || '';
        
        const messageEl = document.getElementById('message');
        const buttonEl = document.getElementById('nextButton');
        
        const message = `On Valentine's Day, no matter how complicated your relationship is, remember that you are valuable and deserve love, whether from yourself or those around you. 💖 Love comes in many forms, and it doesn't have to fit into any box. May today be a day where you give more love to yourself and encounter only good things!`;
        
        const buttonText = "Would you like a gift from us? It's your love prediction!";
        
        const predictions = [
            "ทำตัวเป็นโคนัน พอรู้ความจริงแล้วโคม่าเลย นี่ไงรางวัลของคนเสร่อ",
            "คุยแก้เหงาผมขาลา คุยแก้ผ้าผมขอลุย",
            "รู้แล้วว่าไม่รักแต่ขอทักไปหน่อยได้ไหม",
            "ถ้าฉันต้องวิงวอนเรียกร้องความรักจากเธอเหมือนขอทาน แล้วให้ปะล่ะ ถ้าให้ก็ยอม",
            "มันผิดตั้งแต่กลับมาหากันซ้ำๆซากๆแล้ว",
            "สถานะไม่ให้แต่ให้ไปหา ดีนะยังไม่นอน",
            "ทำทรงลงสตอรี่ผิดหวังกับความรัก จริงๆตัวเองนั่นแหละเหี้ย",
            "หากเวลาย้อนไปตัวฉันก็ยังเต็มใจโดนหลอกอยู่ดี"
        ];
        
        messageEl.textContent = message;
        buttonEl.textContent = buttonText;
        
        buttonEl.addEventListener('click', function() {
            // Randomly pick a prediction
            const randomPrediction = predictions[Math.floor(Math.random() * predictions.length)];
            
            // Redirect to vday2.html with the prediction as a query parameter
            window.location.href = `vday2.html?prediction=${encodeURIComponent(randomPrediction)}`;
        });
    </script>
</body>
</html>
