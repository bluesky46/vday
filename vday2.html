<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width: 100%, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6f2;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .prediction {
            position: absolute;
            z-index: 2;
            color: white;
            font-size: 24px;
            text-align: center;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 80%;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <div class="prediction" id="predictionText"></div>
   
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Get the prediction from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const prediction = urlParams.get('prediction') || "Your love prediction will appear here.";

        // Display the prediction text with typing effect
        const predictionTextEl = document.getElementById('predictionText');
        let i = 0;

        function typeWriter() {
            if (i < prediction.length) {
                predictionTextEl.textContent += prediction.charAt(i);
                i++;
                setTimeout(typeWriter, 100); // Delay for each character (100ms)
            }
        }

        // Start typing effect
        typeWriter();

        function heartPath(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * 10 + canvas.width / 2, y: -y * 10 + canvas.height / 2 };
        }

        let t = Math.PI;
        let drawnPoints = [];
        let isHeartDrawn = false; // Variable to track if the heart has completed drawing

        function drawHeart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = "rgba(255, 102, 153, 1)";
            ctx.lineWidth = 2;

            let start = heartPath(Math.PI);
            ctx.moveTo(start.x, start.y);

            drawnPoints.forEach(point => {
                ctx.lineTo(point.x, point.y);
            });

            if (t >= -Math.PI) {
                drawnPoints.push(heartPath(t));
                t -= 0.02;
            } else if (!isHeartDrawn) {
                // Once the heart is complete, stop drawing and set the flag
                isHeartDrawn = true;
            }

            ctx.stroke();

            // If the heart is not drawn completely, continue the animation
            if (!isHeartDrawn) {
                requestAnimationFrame(drawHeart);
            }
        }

        drawHeart();
    </script>
</body>
</html>
