<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6f2;
            margin: 0;
        }
        .card {
            background-color: #ffccd5;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .btn-primary {
            background-color: #ff6699;
            border-color: #ff6699;
        }
        .btn-primary:hover {
            background-color: #ff3366;
            border-color: #ff3366;
        }
        .form-control {
            border-radius: 15px;
        }
        .btn {
            border-radius: 15px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card text-center" id="card">
        <div id="nameSection">
            <form id="nameForm">
                <div class="mb-3">
                    <input type="text" id="name" name="name" class="form-control" required placeholder="Enter your name">
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
            <p id="greeting" style="display:none; margin-top: 20px; font-size: 18px;"></p>
        </div>

        <div id="heartSituation" style="display:none;">
            <h5 class="card-title" id="heartPrompt">What's your relationship status?</h5>
            <form id="situationForm">
                <div class="mb-3">
                    <select id="situation" name="situation" class="form-control" required>
                        <option value="">Choose...</option>
                      
                        <option value="single.html">Single</option>
                        <option value="dontknow.html">It's complicated</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('nameForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const userName = document.getElementById('name').value;
            const greeting = document.getElementById('greeting');

            greeting.textContent = `Hello, ${userName}! Welcome to Valentine's Day!`;
            greeting.style.display = 'block';
            document.getElementById('nameForm').style.display = 'none';
            document.getElementById('heartSituation').style.display = 'block';
        });

        document.getElementById('situationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const heartStatus = document.getElementById('situation').value;
            
            if (heartStatus) {
                window.location.href = heartStatus;
            }
        });
    </script>
</body>
</html>
